# =========================================
# Docker Compose - MLflow + SeaweedFS + PostgreSQL
# Tutoriel avec bonnes pratiques
# =========================================

services:
  # -----------------------------------------
  # PostgreSQL - Backend Store MLflow
  # Stocke les métadonnées des expériences
  # -----------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: mlflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mlflow-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------------------
  # SeaweedFS - Artifact Store (S3 compatible)
  # Stocke les modèles et artefacts
  # Le fichier d'identités est écrit au démarrage dans un tmpfs, à partir
  # du .env : aucune clé n'est versionnée ni visible dans docker inspect
  # Ports publiés sur la boucle locale : les interfaces web n'ont pas d'auth
  # -----------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    container_name: mlflow-seaweedfs
    hostname: seaweedfs
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:8333:8333" # API S3
      - "127.0.0.1:8888:8888" # Interface web du filer
      - "127.0.0.1:9333:9333" # État du cluster
    tmpfs:
      - /run/seaweedfs:mode=0700
    volumes:
      - seaweedfs_data:/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        umask 077
        cat > /run/seaweedfs/s3.json <<EOF
        {
          "identities": [
            {
              "name": "mlflow",
              "credentials": [
                {
                  "accessKey": "$${S3_ACCESS_KEY}",
                  "secretKey": "$${S3_SECRET_KEY}"
                }
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        EOF
        exec weed server \
          -dir=/data \
          -ip=seaweedfs \
          -master.volumeSizeLimitMB=1024 \
          -volume.max=0 \
          -filer \
          -s3 \
          -s3.port=8333 \
          -s3.config=/run/seaweedfs/s3.json
    # -ip=seaweedfs : le serveur n'écoute que sur ce nom, pas sur localhost
    # /healthz : la racine S3 non authentifiée répond 403
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://seaweedfs:8333/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mlflow-network

  # -----------------------------------------
  # SeaweedFS Setup - Création automatique du bucket
  # -----------------------------------------
  seaweedfs-setup:
    image: chrislusf/seaweedfs:4.51
    container_name: mlflow-seaweedfs-setup
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "s3.bucket.create -name ${S3_BUCKET}" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888
        echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 | grep -q "${S3_BUCKET}"
    networks:
      - mlflow-network

  # -----------------------------------------
  # Runner - Exécution des exemples Python
  # Environnement isolé avec venv
  # -----------------------------------------
  runner:
    image: mlflow-test-bench-runner
    build:
      context: ./examples
      dockerfile: Dockerfile
    container_name: mlflow-runner
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      # Configuration MLflow (accès via le réseau Docker)
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # L'image ne contient pas git : évite l'avertissement de GitPython
      GIT_PYTHON_REFRESH: quiet
      # MLflow 3 envoie par défaut des statistiques d'usage à ses serveurs
      MLFLOW_DISABLE_TELEMETRY: "true"
      # Configuration S3 pour SeaweedFS (artefacts)
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      # Montage des exemples pour développement live
      # Note: pas de :ro pour permettre la création de fichiers temporaires (artefacts)
      - ./examples:/app
    networks:
      - mlflow-network
    # Garde le conteneur actif pour exécution interactive
    stdin_open: true
    tty: true
    # Le conteneur attend (CMD du Dockerfile) : les scripts se lancent avec
    # docker compose exec, jamais au démarrage, pour qu'un up ne crée pas de
    # version du modèle et ne déplace pas l'alias champion
  
  # -----------------------------------------
  # Runner PyTorch - Le runner, plus PyTorch en version CPU
  # Image séparée, car bien plus lourde. Démarre seulement à la demande :
  # docker compose --profile deep up -d --build runner-torch
  # -----------------------------------------
  runner-torch:
    profiles: [ "deep" ]
    image: mlflow-test-bench-runner-torch
    build:
      context: ./examples
      dockerfile: Dockerfile
      target: torch
    container_name: mlflow-runner-torch
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GIT_PYTHON_REFRESH: quiet
      MLFLOW_DISABLE_TELEMETRY: "true"
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./examples:/app
    networks:
      - mlflow-network
  
  # -----------------------------------------
  # Model Server - API de prédiction
  # Sert le modèle qui porte l'alias champion. Démarre seulement à la demande :
  # docker compose --profile serving up -d --wait model-server
  # L'alias est lu au démarrage : après une promotion, redémarrer ce service
  # -----------------------------------------
  model-server:
    profiles: [ "serving" ]
    # La même image que le runner, construite une seule fois
    image: mlflow-test-bench-runner
    build:
      context: ./examples
      dockerfile: Dockerfile
    container_name: mlflow-model-server
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GIT_PYTHON_REFRESH: quiet
      MLFLOW_DISABLE_TELEMETRY: "true"
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      # Seulement pour servir l'assistant LLM de genai_example.py, et recevoir ses traces
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434/v1}
      MLFLOW_EXPERIMENT_NAME: genai-assistant
    # --env-manager local : les dépendances sont celles de l'image, verrouillées
    command:
      - mlflow
      - models
      - serve
      - --model-uri
      - ${MODELE_SERVI:-models:/wine-classifier@champion}
      - --env-manager
      - local
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    # Boucle locale : l'API de prédiction n'a pas d'authentification
    ports:
      - "127.0.0.1:5001:8080"
    networks:
      - mlflow-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ping')" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # -----------------------------------------
  # MLflow Tracking Server
  # Interface principale pour le ML tracking
  # -----------------------------------------
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    container_name: mlflow-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-setup:
        condition: service_completed_successfully
    environment:
      # Configuration du backend store (PostgreSQL)
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Configuration de l'artifact store (SeaweedFS/S3)
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      MLFLOW_ARTIFACT_ROOT: s3://${S3_BUCKET}/
      # Depuis MLflow 3.5, le serveur refuse les en-têtes Host inconnus :
      # mlflow:5000 est l'adresse utilisée par le runner, sur le réseau Docker
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow:5000,localhost:*,127.0.0.1:*
      # Exécuteur de tâches du serveur (évaluation en ligne des traces) : plus
      # de 1 Gio de RAM pour une fonction que le tutoriel n'utilise pas
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      # MLflow 3 envoie par défaut des statistiques d'usage à ses serveurs
      MLFLOW_DISABLE_TELEMETRY: "true"
    # Boucle locale : le serveur MLflow n'a pas d'authentification
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    networks:
      - mlflow-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# -----------------------------------------
# Volumes persistants
# -----------------------------------------
volumes:
  postgres_data:
    name: mlflow-postgres-data
  seaweedfs_data:
    name: mlflow-seaweedfs-data

# -----------------------------------------
# Réseau isolé
# -----------------------------------------
networks:
  mlflow-network:
    name: mlflow-network
    driver: bridge
